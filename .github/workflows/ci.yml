name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads the whole history, not just the tip: a secret
          # buried two commits back is still on the remote.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No secret — a key, a token, anything credential-shaped — may reach the
      # remote, in any commit. The binary is pinned by version and checksum so
      # this step cannot be changed from outside this file.
      - name: Secret scan
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
          rm -f gitleaks gitleaks.tar.gz

      # No dependency — shipped or dev-only — carries a known high/critical
      # advisory. History and the reasoning live in docs/security-findings.md.
      - name: Dependency audit
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also inside `npm test`, but run by name so the security suites pass or
      # fail as their own visible line, not buried in the full run.
      - name: Security suite
        run: npm run test:security

      # Proves the Worker bundles, without deploying or needing credentials.
      - name: Build
        run: npm run build:check
