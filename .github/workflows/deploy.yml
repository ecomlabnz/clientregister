name: Deploy

# Cloudflare pulls from GitHub, not the other way round: main is the only
# thing that reaches production, and it gets there by passing CI first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nothing deploys with a known high/critical advisory in a dependency.
      - name: Dependency audit
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Migrations run before the code that depends on them.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply clientregister-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # The Worker's own secrets live as GitHub repository secrets, so there is
      # one place to manage them and a redeploy can never leave the Worker
      # without them. Only the names that are actually set are uploaded; the
      # rest of the Worker's secrets are left untouched.
      - name: Collect configured secrets
        id: collect
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_ALLOWED_SENDERS: ${{ secrets.WHATSAPP_ALLOWED_SENDERS }}
          INGEST_EMAIL_ALLOWED_SENDERS: ${{ secrets.INGEST_EMAIL_ALLOWED_SENDERS }}
          NZBN_API_KEY: ${{ secrets.NZBN_API_KEY }}
          NZBN_USE_SANDBOX: ${{ secrets.NZBN_USE_SANDBOX }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_INBOX_REFRESH_TOKEN: ${{ secrets.GMAIL_INBOX_REFRESH_TOKEN }}
          GMAIL_INBOX_CLIENT_ID: ${{ secrets.GMAIL_INBOX_CLIENT_ID }}
          GMAIL_INBOX_CLIENT_SECRET: ${{ secrets.GMAIL_INBOX_CLIENT_SECRET }}
          GMAIL_INBOX_ADDRESS: ${{ secrets.GMAIL_INBOX_ADDRESS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/collect-secrets.mjs .secrets.json
          if [ -f .secrets.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload secrets to the Worker
        if: steps.collect.outputs.found == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secret bulk .secrets.json

      - name: Remove the secrets file
        if: always()
        run: rm -f .secrets.json

  # ---------------------------------------------------------------------------
  # Did the deploy break the register?
  #
  # **Asked for on 12 September 2026:** *"again - Access to app.immigration.kiwi
  # was denied ... HTTP ERROR 403 - can we build some sort of detector?"*
  #
  # The practice's register had been returning a bare 403 for under a minute at
  # a time, clearing itself, while somebody was working in it. Two explanations
  # were offered. The first fix did not stop it. That is the point at which
  # guessing stops and measuring starts.
  #
  # This watches the register for two minutes across the window a deployment
  # occupies — **after the practice's own deploy and while the trial's is
  # running**, which is where the evidence points and where nobody can watch by
  # hand. Every answer is written down with its `cf-ray`, which is the one
  # identifier Cloudflare's own logs can be searched by; without it a report is
  # "it broke at some point".
  #
  # It does not gate anything: `continue-on-error`, because a register that is
  # briefly refusing is not a reason to fail a deploy that has already happened.
  # It is here to catch the thing in the act, and it goes red in the run so the
  # deploy that caused it is the one carrying the evidence.
  #
  # Around the deploy rather than around the clock, deliberately: a prober on a
  # five-minute schedule costs more in CI minutes than this fault costs in
  # downtime. If the failures turn out not to cluster here, that is itself the
  # finding, and it moves to a schedule.
  # ---------------------------------------------------------------------------
  watch:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Watch the practice's register through the deploy window
        run: node scripts/probe.mjs https://app.immigration.kiwi/login 20 6000

  # ---------------------------------------------------------------------------
  # The trial practice.
  #
  # **Asked for on 12 September 2026:** *"two deployed workers, existing one +
  # trial one with the test data - and their cores are both updated at the same
  # time."* Architecture in `docs/second-practice.md`.
  #
  # Three things about the shape of this job are deliberate.
  #
  #  * **`needs: deploy`.** The practice's own register goes out first and
  #    alone. A trial that fails to deploy cannot hold up, block or roll back
  #    the register that is in daily use.
  #  * **Gated on `TRIAL_SETUP_TOKEN`.** No such secret and every step below is
  #    skipped, so this is inert until somebody deliberately turns it on, and
  #    turning it off again is deleting one secret.
  #
  #    The gate is a step rather than the job's own `if:`, and that is not a
  #    style choice — **the `secrets` context is not available in a job-level
  #    `if`**, and a workflow that uses it there is rejected whole, before any
  #    job runs. Which is how it was first written here, and it cost the
  #    deployment of one commit on 12 September 2026: no jobs ran at all, so the
  #    practice's own register did not deploy either. Hence also the very first
  #    step: it needs no secret and no network, so a workflow that parses always
  #    produces a job that started.
  #  * **Its own everything.** Its own database, its own sessions, its own
  #    secrets, mapped from `TRIAL_`-prefixed repository secrets onto the names
  #    the Worker reads. Nothing is shared with the practice's Worker but the
  #    code.
  # ---------------------------------------------------------------------------
  deploy-trial:
    runs-on: ubuntu-latest
    needs: deploy
    environment: trial
    steps:
      - name: Is a trial register configured?
        id: gate
        env:
          TRIAL_SETUP_TOKEN: ${{ secrets.TRIAL_SETUP_TOKEN }}
        run: |
          if [ -n "$TRIAL_SETUP_TOKEN" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "A trial register is configured; deploying it."
          else
            echo "No TRIAL_SETUP_TOKEN, so there is no trial register to deploy."
            echo "See docs/operations.md to turn one on."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.on == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.on == 'true'
        run: npm ci

      # Not re-run here: the same commit has already been typechecked, tested
      # and audited by the job this one needs. Running them twice would only
      # make the trial slower to reach.

      # `--env trial` is not decoration. Without it Wrangler looks the database
      # up in the **top-level** config, where the trial's is not — it is inside
      # `env.trial` — and the run fails with "Couldn't find a D1 DB with the
      # name or binding 'clientregister-trial-db' in your wrangler.jsonc file."
      # Which is what happened the first time a trial was configured, on
      # 12 September 2026.
      - name: Apply D1 migrations
        if: steps.gate.outputs.on == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply clientregister-trial-db --remote --env trial

      - name: Deploy Worker
        if: steps.gate.outputs.on == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env trial

      # The trial's own secrets, under the names the Worker reads. Only the ones
      # actually set are uploaded, so a trial can start with nothing but a setup
      # token and gain mail, Drive and the AI later.
      - name: Collect configured secrets
        id: collect
        if: steps.gate.outputs.on == 'true'
        env:
          SETUP_TOKEN: ${{ secrets.TRIAL_SETUP_TOKEN }}
          MAIL_PROVIDER: ${{ secrets.TRIAL_MAIL_PROVIDER }}
          MAIL_FROM: ${{ secrets.TRIAL_MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.TRIAL_RESEND_API_KEY }}
          AI_PROVIDER: ${{ secrets.TRIAL_AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.TRIAL_ANTHROPIC_API_KEY }}
        run: |
          node scripts/collect-secrets.mjs .secrets.json
          if [ -f .secrets.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload secrets to the Worker
        if: steps.collect.outputs.found == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secret bulk .secrets.json --env trial

      - name: Remove the secrets file
        if: always()
        run: rm -f .secrets.json
